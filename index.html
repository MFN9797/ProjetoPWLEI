<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece - Enciclopédia de Personagens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho do Site -->
    <header>
        <div class="header-content">
            <h1>🏛️ Biblioteca de Ohara</h1>
            <p>A tua fonte de histórias das personagens de One Piece</p>
            
            <!-- Barra de Pesquisa -->
            <div class="search-bar">
                <!-- Wrapper para manter a lista agarrada ao input -->
                <div class="input-wrapper">
                    <input type="text" id="searchInput" placeholder="Procurar personagem" autocomplete="off">
                    <ul id="searchSuggestions" class="suggestions-list"></ul>
                </div>
                <button id="searchBtn">Procurar</button>
            </div>
        </div>
    </header>

    <!-- Onde os cartões das personagens vão ser injetados pelo JavaScript -->
    <main class="container">
        <div id="character-grid" class="grid">
            <!-- Os resultados vão aparecer aqui -->
        </div>
    </main>

    <!-- Modal para Detalhes da Personagem -->
    <div id="characterModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div id="modalBody">
                <!-- A história e a imagem detalhada vão aparecer aqui -->
            </div>
        </div>
    </div>

    <footer>
        <p>Projeto de Programação para a Web © 2026</p>
    </footer>

    <!-- Ligação ao ficheiro JavaScript -->
    <script src="script.js"></script>
</body>
</html>
